name: Localization Smoke

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  live-localization:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Restore and build UCAD
        shell: pwsh
        run: |
          dotnet restore src/UCAD.App/UCAD.App.csproj -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Restore failed: $LASTEXITCODE" }
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release --no-restore -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
      - name: Switch and audit zh-CN ja-JP en-US in one running process
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'UCAD\Logs\startup.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem src/UCAD.App/bin -Recurse -Filter 'UCAD.App.exe' | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $exe) { throw 'UCAD.App.exe was not found after build.' }

          $env:UCAD_STARTUP_SMOKE = '1'
          $env:UCAD_LOCALIZATION_SMOKE = '1'
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()

          if (-not (Test-Path $log)) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw 'startup.log was not created.'
          }

          $startupLog = Get-Content $log -Raw
          Write-Output $startupLog
          if ($process.HasExited) { throw "UCAD exited during localization smoke with code $($process.ExitCode)." }
          if ($startupLog -notmatch 'Localization smoke: zh-CN -> ja-JP -> en-US refreshed without restart') {
            Stop-Process -Id $process.Id -Force
            throw 'The one-process trilingual localization marker was not written.'
          }
          foreach ($language in @('zh-CN','ja-JP','en-US')) {
            if ($startupLog -notmatch "Localization surface audit passed: $language / Start \+ shell \+ generated tools") {
              Stop-Process -Id $process.Id -Force
              throw "Rendered Start/shell/generated-tool audit did not pass for $language."
            }
          }
          if ($startupLog -match 'LocalizationSmoke|Localization:UcadV039:|Localization:StartLive:|UnhandledException') {
            Stop-Process -Id $process.Id -Force
            throw 'UCAD reported a runtime localization failure.'
          }

          Stop-Process -Id $process.Id -Force
