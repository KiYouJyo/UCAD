name: v0.8.1 Icon Pass Convergence

on:
  push:
    branches:
      - codex/v0.8-document-dxf-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Apply icon pass
        shell: pwsh
        run: python .github/scripts/apply_icon_pass_v081.py
      - name: Commit converged icon pass
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Output 'Icon pass already converged.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UCAD.App/App.xaml src/UCAD.App/MainWindow.xaml src/UCAD.App/MainWindow.Authoring.cs src/UCAD.App/MainWindow.ExtendedDrawing.cs src/UCAD.App/MainWindow.ModifyShell.cs src/UCAD.App/MainWindow.ModifyCompletion.cs src/UCAD.App/Services/CadToolIconService.cs src/UCAD.App/Styles/UcadCadIcons.xaml src/UCAD.App/Package.appxmanifest VERSION release/release.json release/notes .github/scripts/Validate-UcadUi.ps1
          git commit -m 'v0.8.1 — CAD icon system and UI consistency'
          git push origin HEAD:codex/v0.8-document-dxf-foundation
