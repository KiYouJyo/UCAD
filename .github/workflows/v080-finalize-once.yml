name: v0.8.0 Finalize Once

on:
  push:
    branches:
      - codex/v0.8-document-dxf-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Apply v0.8.0 closure fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Replace-Once([string]$Path, [string]$Old, [string]$New) {
            $text = Get-Content -LiteralPath $Path -Raw
            $count = ([regex]::Matches($text, [regex]::Escape($Old))).Count
            if ($count -ne 1) { throw "Expected one marker in $Path, found $count" }
            [IO.File]::WriteAllText($Path, $text.Replace($Old, $New), [Text.UTF8Encoding]::new($false))
          }

          $blockFactory = @'
          using UCAD.Core.Entities;
          using UCAD.Core.Geometry;
          using UCAD.Core.Modify;

          namespace UCAD.Core.Blocks;

          public static class CadBlockFactory
          {
              private static readonly CadPoint Origin = new(0, 0);

              public static BlockReferenceEntity CreateReference(
                  CadBlockDefinition definition,
                  CadPoint insertionPoint,
                  double scale = 1,
                  double rotationRadians = 0) =>
                  CreateReferenceCore(definition, insertionPoint, scale, rotationRadians, attributeValues: null, preserveId: null);

              public static BlockReferenceEntity CreateReference(
                  CadBlockDefinition definition,
                  CadPoint insertionPoint,
                  IReadOnlyDictionary<string, string>? attributeValues,
                  double scale = 1,
                  double rotationRadians = 0) =>
                  CreateReferenceCore(definition, insertionPoint, scale, rotationRadians, attributeValues, preserveId: null);

              public static BlockReferenceEntity CreateReference(
                  CadBlockDefinition definition,
                  CadPoint insertionPoint,
                  double scale,
                  double rotationRadians,
                  IReadOnlyDictionary<string, string>? attributeValues) =>
                  CreateReferenceCore(definition, insertionPoint, scale, rotationRadians, attributeValues, preserveId: null);

              public static BlockReferenceEntity RefreshReference(CadBlockDefinition definition, BlockReferenceEntity reference)
              {
                  ArgumentNullException.ThrowIfNull(definition);
                  ArgumentNullException.ThrowIfNull(reference);
                  if (!string.Equals(definition.Name, reference.DefinitionName, StringComparison.OrdinalIgnoreCase))
                      throw new ArgumentException("Block definition name does not match the reference.", nameof(definition));
                  return CreateReferenceCore(
                      definition,
                      reference.InsertionPoint,
                      reference.Scale,
                      reference.RotationRadians,
                      reference.AttributeValues,
                      reference.Id);
              }

              public static IReadOnlyList<ICadEntity> Explode(BlockReferenceEntity reference) =>
                  reference.Contents
                      .Select(entity => CadEntityTransform.Translate(entity, new CadVector(0, 0), preserveIdentity: false))
                      .ToArray();

              private static BlockReferenceEntity CreateReferenceCore(
                  CadBlockDefinition definition,
                  CadPoint insertionPoint,
                  double scale,
                  double rotationRadians,
                  IReadOnlyDictionary<string, string>? attributeValues,
                  Guid? preserveId)
              {
                  ArgumentNullException.ThrowIfNull(definition);
                  if (!double.IsFinite(scale) || scale <= 1e-9) throw new ArgumentOutOfRangeException(nameof(scale));
                  if (!double.IsFinite(rotationRadians)) throw new ArgumentOutOfRangeException(nameof(rotationRadians));

                  var toOrigin = new CadVector(-definition.BasePoint.X, -definition.BasePoint.Y);
                  var toInsertion = new CadVector(insertionPoint.X, insertionPoint.Y);
                  var contents = definition.Entities.Select(entity =>
                  {
                      var local = CadEntityTransform.Translate(entity, toOrigin, preserveIdentity: false);
                      var scaled = CadEntityTransform.Scale(local, Origin, scale);
                      var rotated = CadEntityTransform.Rotate(scaled, Origin, rotationRadians);
                      return CadEntityTransform.Translate(rotated, toInsertion);
                  }).ToArray();

                  var values = ResolveAttributes(definition, attributeValues);
                  return preserveId is Guid id
                      ? new BlockReferenceEntity(definition.Name, insertionPoint, contents, scale, rotationRadians, values, id)
                      : new BlockReferenceEntity(definition.Name, insertionPoint, contents, scale, rotationRadians, values);
              }

              private static IReadOnlyDictionary<string, string> ResolveAttributes(
                  CadBlockDefinition definition,
                  IReadOnlyDictionary<string, string>? requested)
              {
                  var values = new Dictionary<string, string>(StringComparer.OrdinalIgnoreCase);
                  foreach (var attribute in definition.AttributeDefinitions)
                  {
                      if (attribute.Constant)
                      {
                          values[attribute.Tag] = attribute.DefaultValue;
                          continue;
                      }
                      values[attribute.Tag] = requested is not null && requested.TryGetValue(attribute.Tag, out var value)
                          ? value ?? string.Empty
                          : attribute.DefaultValue;
                  }
                  return values;
              }
          }
          '@
          $blockFactory = ($blockFactory -replace '(?m)^          ', '')
          [IO.File]::WriteAllText('src/UCAD.Core/Blocks/CadBlockFactory.cs', $blockFactory.TrimStart() + "`n", [Text.UTF8Encoding]::new($false))

          $spatial = @'
          using UCAD.Core.Entities;
          using UCAD.Core.Geometry;
          using UCAD.Core.Interaction;

          namespace UCAD.Core.Spatial;

          public sealed class CadEntitySpatialIndex
          {
              private readonly CadSpatialIndex<ICadEntity> _index;
              private readonly IReadOnlyList<ICadEntity> _unbounded;

              private CadEntitySpatialIndex(CadSpatialIndex<ICadEntity> index, IReadOnlyList<ICadEntity> unbounded)
              {
                  _index = index;
                  _unbounded = unbounded;
              }

              public int Count => _index.Count + _unbounded.Count;

              public static CadEntitySpatialIndex Build(IEnumerable<ICadEntity> entities)
              {
                  ArgumentNullException.ThrowIfNull(entities);
                  var entries = new List<CadSpatialIndexEntry<ICadEntity>>();
                  var unbounded = new List<ICadEntity>();
                  foreach (var entity in entities)
                  {
                      if (TryBounds(entity, out var bounds)) entries.Add(new CadSpatialIndexEntry<ICadEntity>(entity, bounds));
                      else unbounded.Add(entity);
                  }
                  return new CadEntitySpatialIndex(CadSpatialIndex<ICadEntity>.Build(entries), unbounded.AsReadOnly());
              }

              public IReadOnlyList<ICadEntity> Query(CadRect rectangle)
              {
                  if (_unbounded.Count == 0) return _index.Query(rectangle);
                  var result = _index.Query(rectangle).ToList();
                  foreach (var entity in _unbounded)
                      if (IntersectsRectangle(entity, rectangle)) result.Add(entity);
                  return result;
              }

              public ICadEntity? FindNearest(CadPoint point, double maximumDistance)
              {
                  var best = _index.FindNearest(point, maximumDistance, DistanceTo);
                  var bestDistance = best is null ? maximumDistance : DistanceTo(best, point);
                  foreach (var entity in _unbounded)
                  {
                      var distance = DistanceTo(entity, point);
                      if (distance <= bestDistance)
                      {
                          best = entity;
                          bestDistance = distance;
                      }
                  }
                  return bestDistance <= maximumDistance ? best : null;
              }

              private static bool TryBounds(ICadEntity entity, out CadRect bounds)
              {
                  if (CadAnnotationEntityGeometry.TryGetBounds(entity, out bounds)) return true;
                  if (CadExtendedEntityGeometry.TryGetBounds(entity, out bounds)) return true;
                  try
                  {
                      bounds = CadEntityGeometry.GetBounds(entity);
                      return true;
                  }
                  catch (NotSupportedException)
                  {
                      bounds = default;
                      return false;
                  }
              }

              private static bool IntersectsRectangle(ICadEntity entity, CadRect rectangle)
              {
                  if (CadAnnotationEntityGeometry.Supports(entity)) return CadAnnotationEntityGeometry.IntersectsRectangle(entity, rectangle);
                  if (CadExtendedEntityGeometry.Supports(entity)) return CadExtendedEntityGeometry.IntersectsRectangle(entity, rectangle);
                  return CadEntityGeometry.IntersectsRectangle(entity, rectangle);
              }

              private static double DistanceTo(ICadEntity entity, CadPoint point)
              {
                  if (CadAnnotationEntityGeometry.Supports(entity)) return CadAnnotationEntityGeometry.DistanceTo(entity, point);
                  if (CadExtendedEntityGeometry.Supports(entity)) return CadExtendedEntityGeometry.DistanceTo(entity, point);
                  return CadEntityGeometry.DistanceTo(entity, point);
              }
          }
          '@
          $spatial = ($spatial -replace '(?m)^          ', '')
          [IO.File]::WriteAllText('src/UCAD.Core/Spatial/CadEntitySpatialIndex.cs', $spatial.TrimStart() + "`n", [Text.UTF8Encoding]::new($false))

          Replace-Once 'src/UCAD.Core/Interaction/CadEntityGeometry.cs' @'
              public static CadRect GetBounds(ICadEntity entity)
              {
                  ArgumentNullException.ThrowIfNull(entity);
                  return entity switch
          '@.Replace("`n", "`r`n") @'
              public static CadRect GetBounds(ICadEntity entity)
              {
                  ArgumentNullException.ThrowIfNull(entity);
                  if (CadAnnotationEntityGeometry.TryGetBounds(entity, out var annotationBounds)) return annotationBounds;
                  if (CadExtendedEntityGeometry.TryGetBounds(entity, out var extendedBounds)) return extendedBounds;
                  return entity switch
          '@.Replace("`n", "`r`n")

          Replace-Once 'src/UCAD.Core/Interaction/CadEntityGeometry.cs' @'
              public static double DistanceTo(ICadEntity entity, CadPoint point)
              {
                  ArgumentNullException.ThrowIfNull(entity);
                  return entity switch
          '@.Replace("`n", "`r`n") @'
              public static double DistanceTo(ICadEntity entity, CadPoint point)
              {
                  ArgumentNullException.ThrowIfNull(entity);
                  if (CadAnnotationEntityGeometry.Supports(entity)) return CadAnnotationEntityGeometry.DistanceTo(entity, point);
                  if (CadExtendedEntityGeometry.Supports(entity)) return CadExtendedEntityGeometry.DistanceTo(entity, point);
                  return entity switch
          '@.Replace("`n", "`r`n")

          $pdf = Get-Content 'src/UCAD.Core/Plot/CadPdfExporter.cs' -Raw
          $oldPdf = "    {`r`n        if (textOutlineProvider is not null &&`r`n            textOutlineProvider.TryCreateOutline(value, textStyle, out var outline, out var outlineWarning) &&"
          $newPdf = "    {`r`n        string? outlineWarning = null;`r`n        if (textOutlineProvider is not null &&`r`n            textOutlineProvider.TryCreateOutline(value, textStyle, out var outline, out outlineWarning) &&"
          if (-not $pdf.Contains($oldPdf)) { throw 'PDF outline marker not found.' }
          [IO.File]::WriteAllText('src/UCAD.Core/Plot/CadPdfExporter.cs', $pdf.Replace($oldPdf, $newPdf), [Text.UTF8Encoding]::new($false))

          Replace-Once 'src/UCAD.Core/Gis/CadGeoJsonCodec.cs' 'return PolygonGeometry(hatch.Boundary, hatch.EffectiveIslandLoops);' 'return PolygonGeometry(hatch.Boundary, hatch.EffectiveIslandLoops.ToArray());'
          Replace-Once 'src/UCAD.Core/IO/CadNativeDocumentCodecV11.cs' 'root[ExtensionsProperty] = new JsonObject { [ExtensionName] = extension };' 'root[ExtensionsProperty] = new JsonObject { [ExtensionName] = JsonSerializer.SerializeToNode(extension, JsonOptions) };'
          Replace-Once 'src/UCAD.Core/IO/CadNativeDocumentCodecV11.cs' 'Islands = hatch.Islands.Select(loop => loop.Select(ToDto).ToList()).ToList(),' 'Islands = hatch.Islands.Select(loop => (List<PointDto>?)loop.Select(ToDto).ToList()).ToList(),'
          Replace-Once 'src/UCAD.Core/IO/CadNativeDocumentCodecCurrent.cs' 'Islands = hatch.Islands.Select(loop => loop.Select(ToDto).ToList()).ToList(),' 'Islands = hatch.Islands.Select(loop => (List<PointDto>?)loop.Select(ToDto).ToList()).ToList(),'

          $dbf = Get-Content 'src/UCAD.Core/Gis/CadDbfCodec.cs' -Raw
          $oldDbf = "        foreach (var field in fields)`r`n        {`r`n            Span<byte> descriptor = stackalloc byte[32];`r`n            descriptor.Clear();"
          $newDbf = "        Span<byte> descriptor = stackalloc byte[32];`r`n        foreach (var field in fields)`r`n        {`r`n            descriptor.Clear();"
          if (-not $dbf.Contains($oldDbf)) { throw 'DBF descriptor marker not found.' }
          [IO.File]::WriteAllText('src/UCAD.Core/Gis/CadDbfCodec.cs', $dbf.Replace($oldDbf, $newDbf), [Text.UTF8Encoding]::new($false))

          Set-Content -LiteralPath VERSION -Value '0.8.0' -Encoding utf8NoBOM
          $release = Get-Content release/release.json -Raw | ConvertFrom-Json
          $release.product.version = '0.8.0'
          $release.product.packageVersion = '0.8.0.0'
          $release.product.releaseTitle = 'Document & Exchange Foundation'
          $release | ConvertTo-Json -Depth 10 | Set-Content release/release.json -Encoding utf8NoBOM
          Replace-Once 'src/UCAD.App/Package.appxmanifest' 'Version="0.7.0.0"' 'Version="0.8.0.0"'
          Replace-Once '.github/scripts/Validate-UcadUi.ps1' "if (`$version -ne '0.7.0') { throw \"Expected VERSION 0.7.0, got `$version\" }" "if (`$version -ne '0.8.0') { throw \"Expected VERSION 0.8.0, got `$version\" }"

          $zh = @'
          # UCAD v0.8.0 — 文档与交换基础

          UCAD v0.8.0 将 v0.7 的基础二维 CAD 创作闭环扩展为可保存、可交换、可打印的文档工作流，并冻结为本轮验收候选。

          ## 主要更新
          - 原生 `.ucad` 文档读写、最近文件、文件关联启动、自动保存与恢复基础。
          - DXF 导入/导出基础及扩展二维实体交换。
          - POINT、ELLIPSE、SPLINE、RAY、XLINE 等二维实体。
          - STRETCH、ARRAY、FILLET、CHAMFER、JOIN、BREAK 与 Polyline Edit。
          - MTEXT、Leader、角度/半径标注、Hatch/Block 管理扩展。
          - Layout、Page Setup、多视口、打印预览与矢量 PDF 输出。
          - 建筑墙线/房间标注、规划地块指标/表格等专业基础。
          - GeoJSON、CSV Point、Shapefile/DBF/PRJ 与 CRS 交换基础。
          - 空间索引与大图交互查询基础。

          ## 验收边界
          本版本仍不声称完整 DWG 兼容、3D/BIM、动态块或完整 AutoCAD API 兼容。
          '@
          $ja = @'
          # UCAD v0.8.0 — ドキュメント／交換基盤

          UCAD v0.8.0 は v0.7 の 2D CAD 作図ループを、保存・交換・印刷まで含むドキュメントワークフローへ拡張した受け入れ候補です。

          ## 主な更新
          - `.ucad` 保存/読込、最近使ったファイル、関連付け起動、自動保存/復旧基盤。
          - DXF 入出力と拡張 2D エンティティ交換。
          - POINT / ELLIPSE / SPLINE / RAY / XLINE。
          - STRETCH / ARRAY / FILLET / CHAMFER / JOIN / BREAK / Polyline Edit。
          - MTEXT、Leader、角度/半径寸法、Hatch/Block 管理。
          - Layout、Page Setup、複数 Viewport、印刷プレビュー、ベクター PDF。
          - 建築・都市計画向け基礎ヘルパー。
          - GeoJSON、CSV Point、Shapefile/DBF/PRJ、CRS 交換。
          - 空間インデックス基盤。

          ## 対象外
          完全な DWG 互換、3D/BIM、Dynamic Block、AutoCAD API 完全互換は対象外です。
          '@
          $en = @'
          # UCAD v0.8.0 — Document & Exchange Foundation

          UCAD v0.8.0 extends the v0.7 2D authoring loop into a document workflow that can save, exchange and plot drawings, and freezes that work as this acceptance candidate.

          ## Highlights
          - Native `.ucad` open/save, recent files, file activation, autosave and recovery foundations.
          - DXF import/export and extended 2D entity exchange.
          - POINT, ELLIPSE, SPLINE, RAY and XLINE entities.
          - STRETCH, ARRAY, FILLET, CHAMFER, JOIN, BREAK and polyline editing.
          - MTEXT, leaders, angular/radial dimensions, hatch and block-management enhancements.
          - Layouts, page setup, multiple viewports, plot preview and vector PDF export.
          - Foundational architecture and urban-planning helpers.
          - GeoJSON, CSV point, Shapefile/DBF/PRJ and CRS exchange foundations.
          - Spatial indexing for larger-drawing interaction queries.

          ## Scope boundary
          Full DWG compatibility, 3D/BIM, dynamic blocks and full AutoCAD API compatibility remain outside this release.
          '@
          foreach ($pair in @(
            @('docs/RELEASE-NOTES-v0.8.0.md', $zh),
            @('docs/RELEASE-NOTES-v0.8.0.ja.md', $ja),
            @('docs/RELEASE-NOTES-v0.8.0.en.md', $en),
            @('RELEASE_NOTES.md', $zh)
          )) {
            $value = ($pair[1] -replace '(?m)^          ', '').TrimStart() + "`n"
            [IO.File]::WriteAllText($pair[0], $value, [Text.UTF8Encoding]::new($false))
          }

          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch '## 0\.8\.0 — 2026-08-18') {
            $entry = @'
          ## 0.8.0 — 2026-08-18

          ### Document & Exchange Foundation
          - Froze the post-v0.7 branch into a single acceptance candidate covering native document I/O, DXF, plotting/PDF, extended drawing/modify/annotation, layouts, architecture/planning helpers, GIS exchange, autosave/recovery, and spatial-index foundations.
          - Fixed block-reference refresh, extended-entity spatial indexing, PDF outline fallback, GeoJSON hatch islands, native-codec JSON/nullability, and DBF analyzer regressions found by branch validation.

          ### Validation
          - Core tests, WinUI x64 Release build, UI/release contracts, release-certificate signing, one-click package validation and SHA-256 manifest are required before the branch is committed as v0.8.0.

          '@
            $entry = ($entry -replace '(?m)^          ', '').TrimStart()
            $changelog = $changelog.Replace("# Changelog`r`n`r`n", "# Changelog`r`n`r`n$entry")
            [IO.File]::WriteAllText('CHANGELOG.md', $changelog, [Text.UTF8Encoding]::new($false))
          }

          $roadmap = Get-Content ROADMAP.md -Raw
          $newRoadmap = @'
          ## v0.8 — Document & Exchange Foundation

          - [x] native `.ucad` document open/save foundation
          - [x] recent files, file activation, autosave and recovery foundation
          - [x] DXF-first import/export foundation
          - [x] extended 2D entities and Modify/Annotation completion foundation
          - [x] layouts, page setup, multiple viewports and plot preview
          - [x] vector PDF export foundation
          - [x] architecture and planning helper foundation
          - [x] GeoJSON / CSV Point / Shapefile / DBF / PRJ / CRS exchange foundation
          - [x] spatial index and larger-drawing query foundation
          - [x] release-signed acceptance package gate

          ## v0.9–v1.0

          - advanced interoperability and round-trip fidelity
          - performance profiling and large-drawing regression suite
          - professional architecture/planning workflow refinement
          - UI/interaction polish against the Figma visual SSOT

          '@
          $newRoadmap = ($newRoadmap -replace '(?m)^          ', '').TrimStart()
          $roadmap = [regex]::Replace($roadmap, '(?s)## v0\.8–v1\.0\r?\n.*?(?=## Explicitly out of scope for 1\.x)', $newRoadmap)
          [IO.File]::WriteAllText('ROADMAP.md', $roadmap, [Text.UTF8Encoding]::new($false))

      - name: Core tests
        shell: pwsh
        run: |
          dotnet restore tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw "Core restore failed: $LASTEXITCODE" }
          dotnet test tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed: $LASTEXITCODE" }

      - name: WinUI x64 Release build
        shell: pwsh
        run: |
          dotnet restore src/UCAD.App/UCAD.App.csproj -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "App restore failed: $LASTEXITCODE" }
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release --no-restore -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "App build failed: $LASTEXITCODE" }

      - name: UI and release contracts
        shell: pwsh
        run: ./.github/scripts/Validate-UcadUi.ps1

      - name: Validate signing secrets
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:RELEASE_CERTIFICATE_PASSWORD)) { throw 'GitHub release signing secrets are not configured.' }

      - name: Build unsigned acceptance MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UCAD-AppPackages'
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }
          $assets = Join-Path $env:RUNNER_TEMP 'UCAD-v0.8.0-signed-acceptance'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $finalBundle = Join-Path $assets 'UCAD_0.8.0.0_x64.msixbundle'
          Copy-Item -LiteralPath $bundle.FullName -Destination $finalBundle -Force
          "BUNDLE_PATH=$finalBundle" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSETS_PATH=$assets" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign and verify acceptance bundle
        shell: pwsh
        env:
          RELEASE_CERTIFICATE_BASE64: ${{ secrets.GH_RELEASE_CERTIFICATE_BASE64 }}
          RELEASE_CERTIFICATE_PASSWORD: ${{ secrets.GH_RELEASE_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'ucad-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:RELEASE_CERTIFICATE_BASE64))
          $securePassword = ConvertTo-SecureString $env:RELEASE_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $certificate.HasPrivateKey) { throw 'Release certificate has no private key.' }
          if ($certificate.Subject -cne 'CN=AppPublisher') { throw "Unexpected certificate subject: $($certificate.Subject)" }
          $cer = Join-Path $env:ASSETS_PATH 'UCAD-v0.8.0-release.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          $kitsRoot = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kitsRoot 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'x64 signtool.exe was not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          $signature = Get-AuthenticodeSignature -FilePath $env:BUNDLE_PATH
          if (-not $signature.SignerCertificate) { throw 'Signed bundle has no signer certificate.' }
          if ($signature.SignerCertificate.Thumbprint -cne $certificate.Thumbprint) { throw 'Signer thumbprint mismatch.' }
          if ($signature.Status -ne 'Valid' -and $signature.Status -ne 'UnknownError') { throw "Unexpected signature status: $($signature.Status)" }
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Signed by $($certificate.Subject) / $($certificate.Thumbprint)"

      - name: Generate and validate one-click installer
        shell: pwsh
        run: |
          $release = Get-Content release/release.json -Raw | ConvertFrom-Json
          $stage = Join-Path $env:RUNNER_TEMP 'UCAD-OneClick'
          $root = & ./packaging/New-GitHubOneClickInstallerPackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $stage -DisplayVersion $release.product.version -PackageVersion $release.product.packageVersion -PackageIdentityName $release.product.packageIdentityName -Publisher $release.product.publisher -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $root
          $zip = Join-Path $env:ASSETS_PATH 'UCAD-v0.8.0-x64-one-click.zip'
          Compress-Archive -LiteralPath $root -DestinationPath $zip -CompressionLevel Optimal
          $names = @('UCAD_0.8.0.0_x64.msixbundle','UCAD-v0.8.0-x64-one-click.zip')
          $lines = foreach ($name in $names) {
            $file = Join-Path $env:ASSETS_PATH $name
            "{0}  {1}" -f (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant(), $name
          }
          Set-Content -LiteralPath (Join-Path $env:ASSETS_PATH 'SHA256SUMS.txt') -Value $lines -Encoding ASCII

      - name: Commit finalized v0.8.0 candidate
        shell: pwsh
        run: |
          Remove-Item -LiteralPath '.github/scripts/finalize_v080.py' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '.github/workflows/v080-finalize-once.yml' -Force -ErrorAction SilentlyContinue
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.8.0 — Document & Exchange Foundation'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin HEAD:codex/v0.8-document-dxf-foundation
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }

      - name: Upload signed acceptance package
        uses: actions/upload-artifact@v4
        with:
          name: UCAD-v0.8.0-signed-acceptance
          path: ${{ env.ASSETS_PATH }}
          if-no-files-found: error
          retention-days: 14
