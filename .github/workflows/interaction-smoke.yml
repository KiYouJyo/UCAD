name: Interaction Smoke

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  interaction-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Restore and build UCAD
        shell: pwsh
        run: |
          dotnet restore src/UCAD.App/UCAD.App.csproj -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Restore failed: $LASTEXITCODE" }
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release --no-restore -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
      - name: Validate Selection ERASE OSNAP Ortho and Inspector in one process
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'UCAD\Logs\startup.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem src/UCAD.App/bin -Recurse -Filter 'UCAD.App.exe' | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $exe) { throw 'UCAD.App.exe was not found after build.' }

          $env:UCAD_STARTUP_SMOKE = '1'
          $env:UCAD_INTERACTION_SMOKE = '1'
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 10
          $process.Refresh()

          if (-not (Test-Path $log)) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw 'startup.log was not created.'
          }

          $startupLog = Get-Content $log -Raw
          Write-Output $startupLog
          if ($process.HasExited) {
            throw "UCAD exited during interaction smoke with code $($process.ExitCode)."
          }
          if ($startupLog -notmatch 'Interaction smoke: Selection \+ ERASE \+ OSNAP \+ ORTHO \+ Inspector initialized') {
            Stop-Process -Id $process.Id -Force
            throw 'The v0.4 interaction smoke marker was not written.'
          }
          if ($startupLog -match 'InteractionSmoke|UnhandledException|MissingResource:') {
            Stop-Process -Id $process.Id -Force
            throw 'UCAD reported an interaction/runtime failure.'
          }

          Stop-Process -Id $process.Id -Force
