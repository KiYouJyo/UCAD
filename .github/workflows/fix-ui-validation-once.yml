name: Fix UI Validation Once

on:
  push:
    branches:
      - codex/v0.8-document-dxf-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restrict XAML scan to files
        shell: pwsh
        run: |
          $path = '.github/scripts/Validate-UcadUi.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $old = "Get-ChildItem src/UCAD.App -Recurse -Filter '*.xaml'"
          $new = "Get-ChildItem src/UCAD.App -Recurse -File -Filter '*.xaml'"
          if (-not $text.Contains($old)) { throw 'Validation scan marker not found.' }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
          Remove-Item -LiteralPath '.github/workflows/fix-ui-validation-once.yml' -Force
      - name: Commit validation fix
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix UI validation source-only XAML scan'
          git push origin HEAD:codex/v0.8-document-dxf-foundation
