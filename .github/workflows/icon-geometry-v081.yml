name: v0.8.1 Icon Geometry Convergence

on:
  push:
    branches:
      - codex/v0.8-document-dxf-foundation

permissions:
  contents: write

jobs:
  converge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Generate explicit PathGeometry resources
        run: python .github/scripts/fix_icon_geometry_v081.py
      - name: Commit generated icon geometry
        shell: pwsh
        run: |
          if (-not (git status --porcelain src/UCAD.App/Styles/UcadCadIcons.xaml)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/UCAD.App/Styles/UcadCadIcons.xaml
          git commit -m 'Fix v0.8.1 explicit CAD PathGeometry resources'
          git push origin HEAD:codex/v0.8-document-dxf-foundation
