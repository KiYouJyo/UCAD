name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        run: dotnet test tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj --configuration Release

      - name: Publish x64 preview
        run: >-
          dotnet publish src/UCAD.App/UCAD.App.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          --self-contained true
          --output artifacts/UCAD-win-x64

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/UCAD-win-x64/* -DestinationPath artifacts/UCAD-${{ github.ref_name }}-win-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCAD-${{ github.ref_name }}-win-x64
          path: artifacts/UCAD-${{ github.ref_name }}-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          files: artifacts/UCAD-${{ github.ref_name }}-win-x64.zip
