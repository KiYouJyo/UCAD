name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          }
          else {
            $version = (Get-Content VERSION -Raw).Trim()
            $tag = "v$version"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "archive=UCAD-$tag-win-x64.zip" >> $env:GITHUB_OUTPUT

      - name: Test core
        run: dotnet test tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj --configuration Release

      - name: Publish x64
        run: >-
          dotnet publish src/UCAD.App/UCAD.App.csproj
          --configuration Release
          --runtime win-x64
          -p:Platform=x64
          --self-contained true
          --output artifacts/UCAD-win-x64

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path artifacts/UCAD-win-x64/* -DestinationPath artifacts/${{ steps.version.outputs.archive }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: UCAD-${{ steps.version.outputs.tag }}-win-x64
          path: artifacts/${{ steps.version.outputs.archive }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: UCAD ${{ steps.version.outputs.tag }} — Foundation Release
          body_path: RELEASE_NOTES.md
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: artifacts/${{ steps.version.outputs.archive }}
