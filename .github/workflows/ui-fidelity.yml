name: UI Fidelity Screenshots

on:
  push:
    branches:
      - 'codex/v0.3.9-ui-fidelity'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ui-fidelity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-1440x900:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'

      - name: Build unsigned x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UCAD-UiPackages'
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release -p:Platform=x64 -r win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }
          "BUNDLE_PATH=$($bundle.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install unsigned packaged UCAD for UI capture
        shell: pwsh
        run: |
          $appModelUnlock = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $appModelUnlock -Force | Out-Null
          New-ItemProperty -Path $appModelUnlock -Name AllowDevelopmentWithoutDevLicense -PropertyType DWord -Value 1 -Force | Out-Null
          Add-AppxPackage -Path $env:BUNDLE_PATH -AllowUnsigned
          $package = Get-AppxPackage | Where-Object { $_.Name -eq 'F1BD5F25-4ED6-4037-B9FE-BB7D4B326E25' } | Select-Object -First 1
          if (-not $package) { throw 'Installed UCAD package was not found.' }
          $exe = Join-Path $package.InstallLocation 'UCAD.App.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable was not found: $exe" }
          "INSTALLED_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Installed unsigned packaged UCAD at $($package.InstallLocation)"

      - name: Capture Drawing, Start, and Settings screens
        shell: pwsh
        run: |
          ./.github/scripts/Capture-UcadUi.ps1 -ExePath $env:INSTALLED_EXE -OutputDirectory "$env:RUNNER_TEMP\ucad-fidelity"

      - name: Upload fidelity screenshots
        uses: actions/upload-artifact@v6
        with:
          name: ucad-v0.3.9-fidelity-1440x900
          path: ${{ runner.temp }}\ucad-fidelity\*.png
          if-no-files-found: error
          retention-days: 14
