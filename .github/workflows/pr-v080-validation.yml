name: v0.8.0 PR Acceptance

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  acceptance:
    if: github.head_ref == 'codex/v0.8-document-dxf-foundation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Core tests
        shell: pwsh
        run: |
          dotnet restore tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj
          dotnet test tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj -c Release --no-restore
      - name: WinUI x64 Release build
        shell: pwsh
        run: |
          dotnet restore src/UCAD.App/UCAD.App.csproj -p:Platform=x64 -r win-x64
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release --no-restore -p:Platform=x64 -r win-x64
      - name: UI and release contracts
        shell: pwsh
        run: ./.github/scripts/Validate-UcadUi.ps1
