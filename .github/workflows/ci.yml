name: CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Restore core tests
        run: dotnet restore tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj
      - name: Run core tests
        run: dotnet test tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj --configuration Release --no-restore

  app-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Restore app
        run: dotnet restore src/UCAD.App/UCAD.App.csproj -p:Platform=x64 -r win-x64
      - name: Build app
        run: dotnet build src/UCAD.App/UCAD.App.csproj --configuration Release --no-restore -p:Platform=x64 -r win-x64

  startup-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Validate Figma shell, version, icon, and HiDPI contracts
        shell: pwsh
        run: |
          $manifest = Get-Content src/UCAD.App/app.manifest -Raw
          if ($manifest -notmatch 'PerMonitorV2') { throw 'UCAD must declare PerMonitorV2.' }

          $xaml = Get-Content src/UCAD.App/MainWindow.xaml -Raw
          if ($xaml -match '<TitleBar\b|TitleBar\.Content') { throw 'Shell must use the explicit browser-style title strip, not TitleBar.Content.' }
          foreach ($required in @('TitleDragRegion','DocumentTabs','PageOverlay','SettingsButton')) {
            if ($xaml -notmatch [regex]::Escape($required)) { throw "Missing shell contract element: $required" }
          }

          $allXaml = (Get-ChildItem src/UCAD.App -Recurse -Filter '*.xaml' | ForEach-Object { Get-Content $_.FullName -Raw }) -join "`n"
          foreach ($fake in @('╱','⌁','▭','○','◜','↖','✥','⧉','▧','⬚','↗','＋','⇆','⌇','⌗','⌖','◇','◎','◫')) {
            if ($allXaml.Contains($fake)) { throw "Unicode placeholder icon remains in production XAML: $fake" }
          }

          $tokens = Get-Content src/UCAD.App/Styles/UcadDesignTokens.xaml -Raw
          foreach ($required in @('UcadTitleBarHeight','UcadCategoryBarHeight','UcadToolShelfHeight','UcadDocumentTabWidth','UcadSettingsNavWidth','UcadSettingsCardWidth','UcadSettingsCardHeight','UcadSettingsTitleToSectionSpacing','UcadSettingsSectionToCardSpacing','UcadSettingsCardSpacing','UcadSettingsSectionSpacing')) {
            if ($tokens -notmatch [regex]::Escape($required)) { throw "Missing Figma design token: $required" }
          }
          foreach ($pair in @(@('UcadDocumentTabWidth','190'),@('UcadSettingsNavWidth','228'),@('UcadSettingsCardWidth','940'),@('UcadSettingsCardHeight','72'),@('UcadSettingsTitleToSectionSpacing','35'),@('UcadSettingsSectionToCardSpacing','12'),@('UcadSettingsCardSpacing','8'),@('UcadSettingsSectionSpacing','30'))) {
            $needle = ('x:Key="{0}">{1}<' -f $pair[0], $pair[1])
            if (-not $tokens.Contains($needle)) { throw "Figma token mismatch: $($pair[0])" }
          }

          $version = (Get-Content VERSION -Raw).Trim()
          $release = Get-Content release/release.json -Raw | ConvertFrom-Json
          [xml]$package = Get-Content src/UCAD.App/Package.appxmanifest -Raw
          if ($version -ne '0.3.9') { throw "Expected VERSION 0.3.9, got $version" }
          if ($release.product.version -ne $version) { throw 'release.json version must match VERSION.' }
          if ($release.product.packageVersion -ne "$version.0") { throw 'release packageVersion must be VERSION + .0.' }
          if ($package.Package.Identity.Version -ne "$version.0") { throw 'MSIX Identity.Version must match VERSION + .0.' }
          $project = Get-Content src/UCAD.App/UCAD.App.csproj -Raw
          if ($project -match '<Version>|<AssemblyVersion>|<FileVersion>|<InformationalVersion>') { throw 'UCAD.App.csproj must not hardcode version metadata.' }

          foreach ($view in @('src/UCAD.App/Views/StartPage.xaml','src/UCAD.App/Views/UcadSettingsPage.xaml','src/UCAD.App/Views/UcadSettingsPage.xaml.cs','src/UCAD.App/Controls/SettingCard.xaml')) {
            if (-not (Test-Path $view)) { throw "Missing UI foundation file: $view" }
          }
          $settingsCode = Get-Content src/UCAD.App/Views/UcadSettingsPage.xaml.cs -Raw
          foreach ($section in @('BuildGeneral','BuildAppearance','BuildDrafting','BuildInput','BuildFiles','BuildLanguage','BuildAbout')) {
            if ($settingsCode -notmatch [regex]::Escape($section)) { throw "Missing Settings section: $section" }
          }
          Write-Output 'Validated UI fidelity, icon, version, PMv2, and Settings contracts.'

      - name: Validate localization resource sets
        shell: pwsh
        run: |
          $locales = @('zh-CN','ja-JP','en-US')
          $defaultSets = @{}
          foreach ($locale in $locales) {
            $path = "src/UCAD.App/Strings/$locale/Resources.resw"
            [xml]$xml = Get-Content $path -Raw
            $defaultSets[$locale] = @($xml.root.data | ForEach-Object { [string]$_.name } | Sort-Object -Unique)
          }
          $baseline = $defaultSets['zh-CN']
          foreach ($locale in $locales) {
            $missing = @($baseline | Where-Object { $_ -notin $defaultSets[$locale] })
            if ($missing.Count -gt 0) { throw "Default RESW keys missing in $locale: $($missing -join ', ')" }
          }

          $v039 = @{}
          foreach ($locale in $locales) {
            $path = "src/UCAD.App/Strings/$locale/UcadV039.resw"
            if (-not (Test-Path $path)) { throw "Missing v0.3.9 RESW: $path" }
            [xml]$xml = Get-Content $path -Raw
            $v039[$locale] = @($xml.root.data | ForEach-Object { [string]$_.name } | Sort-Object -Unique)
          }
          $v039Baseline = $v039['zh-CN']
          foreach ($locale in $locales) {
            $missing = @($v039Baseline | Where-Object { $_ -notin $v039[$locale] })
            $extra = @($v039[$locale] | Where-Object { $_ -notin $v039Baseline })
            if ($missing.Count -gt 0 -or $extra.Count -gt 0) { throw "v0.3.9 RESW key mismatch in $locale. Missing: $($missing -join ', '); Extra: $($extra -join ', ')" }
          }
          foreach ($required in @('Start_TabTitle','Settings_TabTitle','Settings_General_Title','Settings_Appearance_Title','Settings_Drafting_Title','Settings_Input_Title','Settings_Files_Title','Settings_Language_Title','Settings_About_Title')) {
            if ($required -notin $v039Baseline) { throw "Missing required localized UI key: $required" }
          }
          Write-Output "Validated $($v039Baseline.Count) v0.3.9 UI keys across zh-CN, ja-JP, and en-US."

      - name: Build app for startup smoke test
        shell: pwsh
        run: |
          dotnet restore src/UCAD.App/UCAD.App.csproj -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Restore failed: $LASTEXITCODE" }
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release --no-restore -p:Platform=x64 -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }

      - name: Launch UCAD and initialize Start plus Settings
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'UCAD\Logs\startup.log'
          Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          $exe = Get-ChildItem src/UCAD.App/bin -Recurse -Filter 'UCAD.App.exe' | Where-Object FullName -match '\\Release\\' | Select-Object -First 1
          if (-not $exe) { throw 'UCAD.App.exe was not found after build.' }
          $env:UCAD_STARTUP_SMOKE = '1'
          $process = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            if (Test-Path $log) { Get-Content $log -Raw }
            throw "UCAD exited during startup smoke test with code $($process.ExitCode)."
          }
          if (-not (Test-Path $log)) { Stop-Process -Id $process.Id -Force; throw 'startup.log was not created.' }
          $startupLog = Get-Content $log -Raw
          if ($startupLog -notmatch 'Startup smoke: Start and Settings initialized') { Stop-Process -Id $process.Id -Force; throw 'Start/Settings smoke marker was not written.' }
          if ($startupLog -match 'MissingResource:|UnhandledException|CreateInitialPage') { Write-Output $startupLog; Stop-Process -Id $process.Id -Force; throw 'UCAD reported a startup/resource exception.' }
          Write-Output "UCAD Start and Settings remained alive for 8 seconds (PID $($process.Id))."
          Stop-Process -Id $process.Id -Force

  package-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Build unsigned x64 MSIX bundle
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UCAD-AppPackages'
          dotnet build src/UCAD.App/UCAD.App.csproj -c Release -p:Platform=x64 -r win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Always -p:AppxBundlePlatforms=x64 -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$output\"
          if ($LASTEXITCODE -ne 0) { throw "MSIX build failed: $LASTEXITCODE" }
          $bundle = @(Get-ChildItem $output -Recurse -Filter '*.msixbundle') | Select-Object -First 1
          if (-not $bundle) { throw 'MSIX bundle was not produced.' }
          "BUNDLE_PATH=$($bundle.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Sign with ephemeral CI certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=AppPublisher' -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3')
          $cer = Join-Path $env:RUNNER_TEMP 'ucad-ci.cer'
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          $kitsRoot = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $signtool = Get-ChildItem (Join-Path $kitsRoot 'Windows Kits\10\bin') -Recurse -Filter signtool.exe | Where-Object FullName -match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found.' }
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $env:BUNDLE_PATH
          if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
          "CERTIFICATE_PATH=$cer" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate and validate production one-click package
        shell: pwsh
        run: |
          $release = Get-Content release/release.json -Raw | ConvertFrom-Json
          $stage = Join-Path $env:RUNNER_TEMP 'one-click'
          $root = & ./packaging/New-GitHubOneClickInstallerPackage.ps1 -SignedBundlePath $env:BUNDLE_PATH -PublicCertificatePath $env:CERTIFICATE_PATH -OutputDirectory $stage -DisplayVersion $release.product.version -PackageVersion $release.product.packageVersion -PackageIdentityName $release.product.packageIdentityName -Publisher $release.product.publisher -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
          & ./packaging/Test-GitHubOneClickInstallerPackage.ps1 -ReleaseDirectory $root
