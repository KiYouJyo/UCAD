name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore core tests
        run: dotnet restore tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj
      - name: Run core tests
        run: dotnet test tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj --configuration Release --no-restore

  app-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore app
        run: dotnet restore src/UCAD.App/UCAD.App.csproj -p:Platform=x64
      - name: Build app
        run: dotnet build src/UCAD.App/UCAD.App.csproj --configuration Release --no-restore -p:Platform=x64
