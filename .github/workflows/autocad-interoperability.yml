name: AutoCAD Interoperability

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'agent/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  autocad-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.302'
      - name: Fetch and verify pinned real-world AutoCAD fixtures
        shell: pwsh
        run: ./.github/scripts/Get-AutoCadFixtures.ps1
      - name: Restore Core tests
        shell: pwsh
        run: dotnet restore tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj
      - name: Run AutoCAD interoperability corpus and stress regressions
        shell: pwsh
        run: |
          dotnet test tests/UCAD.Core.Tests/UCAD.Core.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~AutoCadFixtureCorpusTests|FullyQualifiedName~AcadLargeDrawingRegressionTests|FullyQualifiedName~AcadOpaquePreservationTests"
          if ($LASTEXITCODE -ne 0) { throw "AutoCAD interoperability regression failed: $LASTEXITCODE" }
