name: Bug report
description: Report a reproducible UCAD defect
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Click…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UCAD version
      placeholder: v0.1.0
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
